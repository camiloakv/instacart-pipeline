version: 2

models:
  - name: int_order_products_unioned
    description: "Order-product line items (prior + train) joined with order metadata."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: eval_set
        tests:
          - accepted_values:
              values: ['prior', 'train']

  - name: int_user_order_stats
    description: "One row per user, summarizing overall ordering behavior."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: user_total_orders
        tests:
          - not_null

  - name: int_user_product_stats
    description: "One row per (user, product) pair seen in prior orders, with purchase history stats."
    columns:
      - name: user_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: up_times_ordered
        tests:
          - not_null

  - name: int_product_stats
    description: "One row per product, summarizing overall reorder behavior."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_reorder_rate
        tests:
          - not_null
